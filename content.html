<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <title></title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css?v0.7.0">
    <script type="text/javascript" src="tools.js?v0.7.0"></script>

</head>

<body>

<div class="container">
    <header class="page-header">
        <a href="index.html"><h1 class="novel-title"></h1></a>
        <a href="about.html" class="btn btn-info btn-lg">簡介</a>
    </header>
    <div class="panel panel-default">
        <div class="panel-heading">
            <h3 class="panel-title tt-title"></h3>
        </div>
        <div class="panel-body tt-body">載入中…</div>
    </div>
    <nav>
        <ul class="pager">
            <li class="previous disabled">
                <a href="#" class="previous"><span aria-hidden="true">&larr;</span> 上一節</a>
            </li>
            <li class="next disabled">
                <a href="#" class="next">下一節 <span aria-hidden="true">&rarr;</span></a>
            </li>
        </ul>
    </nav>
</div>

<script>

window.onload=init;

var pager_url = {};

function init(){
    var dict = getParametersDict();
    var chapter = dict["chapter"] || "";
    var tt = dict["tt"] || "";

    initNovelTitle();
    document.querySelector("h3.tt-title").textContent = chapter + "/" + removeFileExt(tt);

    loadContent(chapter, tt);
    initPager(chapter, tt);

    document.addEventListener("keydown", function(down_event){
        var key = down_event.key;

        // Alt+← 等是瀏覽器自己的快捷鍵
        if(down_event.altKey || down_event.ctrlKey || down_event.metaKey || down_event.shiftKey)
            return;

        if(key == "ArrowLeft" && pager_url["previous"])
            document.location.href = pager_url["previous"];
        else if(key == "ArrowRight" && pager_url["next"])
            document.location.href = pager_url["next"];
    });
}

function loadContent(chapter, tt){
    var tt_body = document.querySelector("div.tt-body");

    fetchText(noCacheUrl(getTextUrl(chapter, tt))).then(function(res){
        if(getFileExtByFilename(tt).toLowerCase() == "md")
            tt_body.innerHTML = markdownToHtml(res);
        else
            tt_body.innerHTML = textToHtml(res);
    }, function(){
        tt_body.textContent = "";
        tt_body.appendChild(el("div", "text-danger",
                               "讀不到這一節的內容：" + chapter + "/" + tt));
    });
}

function initPager(chapter, tt){
    Promise.all([fetchText(noCacheUrl("chapters.txt")),
                 fetchText(noCacheUrl(getChapterListUrl(chapter)))]
    ).then(function(res){
        var chap_list = getArrayByString(res[0]);
        var tt_list = getArrayByString(res[1]);
        var chap_id = chap_list.indexOf(chapter);
        var tt_id = tt_list.indexOf(tt);

        // 不在列表裡就沒有前後可言
        if(chap_id == -1 || tt_id == -1)
            return;

        setupPrev(chap_list, tt_list, chap_id, tt_id);
        setupNext(chap_list, tt_list, chap_id, tt_id);
    }, function(){
        // 列表讀不到就不開前後頁
    });
}

function setupPrev(chap_list, tt_list, chap_id, tt_id){
    if(tt_id > 0){
        enablePager("previous", chap_list[chap_id], tt_list[tt_id - 1]);
        return;
    }

    if(chap_id == 0)
        return;

    var prev_chap = chap_list[chap_id - 1];
    getArrayByFilename(getChapterListUrl(prev_chap), function(prev_tt_list){
        if(prev_tt_list.length == 0)
            return;

        enablePager("previous", prev_chap, prev_tt_list[prev_tt_list.length - 1]);
    });
}

function setupNext(chap_list, tt_list, chap_id, tt_id){
    if(tt_id < tt_list.length - 1){
        enablePager("next", chap_list[chap_id], tt_list[tt_id + 1]);
        return;
    }

    if(chap_id == chap_list.length - 1)
        return;

    var next_chap = chap_list[chap_id + 1];
    getArrayByFilename(getChapterListUrl(next_chap), function(next_tt_list){
        if(next_tt_list.length == 0)
            return;

        enablePager("next", next_chap, next_tt_list[0]);
    });
}

// href 設好才解除 disabled，不然按鈕會先出現但連到 "#"
function enablePager(dir, chapter, tt){
    pager_url[dir] = getContentUrl(chapter, tt);
    document.querySelector("a." + dir).href = pager_url[dir];
    document.querySelector("li." + dir).classList.remove("disabled");
}

</script>

</body>
</html>
