<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <title> [小說書名] </title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/jquery@1.12.1/dist/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.4/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.4/dist/css/bootstrap-theme.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.3.4/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/showdown@1.9.1/dist/showdown.min.js"></script>

    <script type="text/javascript" src="tools.js?v0.4.0"></script>

</head>

<body>

<div class="container">
<div class="row">
    <div class="col-md-8 col-md-offset-2">
        <div class="page-header">
            <div class="row">
                <div class="col-md-10"> <a href="index.html">
                    <h1 class="novel-title">[小說書名]</h1>
                </a></div>
                <div class="col-md-2">
                    <br> <a href="about.html" class="btn btn-info btn-lg">簡介</a>
                </div>
            </div>
        </div>
        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title tt-title">[章名]/[節名]</h3>
            </div>
            <div class="panel-body tt-body" style="font-size: 120%; background-color: #E7F3ED;">
                [行一] <br><br>
                [行二]
            </div>
        </div>
        <nav>
            <ul class="pager">
                <li class="previous disabled">
                    <a href="#" class="previous"><span aria-hidden="true">&larr;</span> Older</a>
                </li>
                <li class="next disabled">
                    <a href="#" class="next">Newer <span aria-hidden="true">&rarr;</span></a>
                </li>
            </ul>
        </nav>
    </div>
</div>
</div>

<script>

window.onload=init;

var converter = new showdown.Converter();
var pager_url = {};

function init(){
    var dict = getParametersDict();
    var chapter = dict["chapter"] || "";
    var tt = dict["tt"] || "";

    initNovelTitle();
    $("h3.tt-title").text(chapter + "/" + removeFileExt(tt));

    loadContent(chapter, tt);
    initPager(chapter, tt);

    $(document).keydown(function(down_event){
        var keycode = down_event.which;

        if(keycode == 37 && pager_url["previous"])
            document.location.href = pager_url["previous"];
        else if(keycode == 39 && pager_url["next"])
            document.location.href = pager_url["next"];
    });
}

function loadContent(chapter, tt){
    var tt_body = $("div.tt-body");

    $.get(getTextUrl(chapter, tt), function(res){
        if(getFileExtByFilename(tt) == "md")
            tt_body.html(converter.makeHtml(res));
        else
            tt_body.html(textToHtml(res));
    }).fail(function(){
        tt_body.empty().append(getNewDiv().addClass("text-danger")
                                          .text("讀不到這一節的內容：" + chapter + "/" + tt));
    });
}

function initPager(chapter, tt){
    $.when($.get(noCacheUrl("chapters.txt")),
           $.get(noCacheUrl(getChapterListUrl(chapter)))
    ).done(function(chap_res, tt_res){
        var chap_list = getArrayByString(chap_res[0]);
        var tt_list = getArrayByString(tt_res[0]);
        var chap_id = chap_list.indexOf(chapter);
        var tt_id = tt_list.indexOf(tt);

        // 不在列表裡就沒有前後可言
        if(chap_id == -1 || tt_id == -1)
            return;

        setupPrev(chap_list, tt_list, chap_id, tt_id);
        setupNext(chap_list, tt_list, chap_id, tt_id);
    });
}

function setupPrev(chap_list, tt_list, chap_id, tt_id){
    if(tt_id > 0){
        enablePager("previous", chap_list[chap_id], tt_list[tt_id - 1]);
        return;
    }

    if(chap_id == 0)
        return;

    var prev_chap = chap_list[chap_id - 1];
    getArrayByFilename(getChapterListUrl(prev_chap), function(prev_tt_list){
        if(prev_tt_list.length == 0)
            return;

        enablePager("previous", prev_chap, prev_tt_list[prev_tt_list.length - 1]);
    });
}

function setupNext(chap_list, tt_list, chap_id, tt_id){
    if(tt_id < tt_list.length - 1){
        enablePager("next", chap_list[chap_id], tt_list[tt_id + 1]);
        return;
    }

    if(chap_id == chap_list.length - 1)
        return;

    var next_chap = chap_list[chap_id + 1];
    getArrayByFilename(getChapterListUrl(next_chap), function(next_tt_list){
        if(next_tt_list.length == 0)
            return;

        enablePager("next", next_chap, next_tt_list[0]);
    });
}

// href 設好才解除 disabled，不然按鈕會先出現但連到 "#"
function enablePager(dir, chapter, tt){
    pager_url[dir] = getContentUrl(chapter, tt);
    $("a." + dir).attr("href", pager_url[dir]);
    $("li." + dir).removeClass("disabled");
}

</script>

</body>
</html>
