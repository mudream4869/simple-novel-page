<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <title> [小說書名] </title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/jquery@1.12.1/dist/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.4/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.4/dist/css/bootstrap-theme.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.3.4/dist/js/bootstrap.min.js"></script>

    <script type="text/javascript" src="tools.js?v0.4.0"></script>

</head>

<body>

<div class="container">
<div class="row">
    <div class="col-md-8 col-md-offset-2 cont">
        <div class="page-header">
            <div class="row">
                <div class="col-md-10"> <a href="index.html">
                    <h1 class="novel-title">[小說書名]</h1>
                </a></div>
                <div class="col-md-2">
                    <br> <a href="about.html" class="btn btn-info btn-lg">簡介</a>
                </div>
            </div>
        </div>
        <div class="about-body">本書介紹</div>
    </div>
</div>
</div>

<script>

window.onload=init;

function init(){
    initNovelTitle();

    // 有 about.txt 就拿來當簡介，沒有就留著預設文字
    $.get(noCacheUrl("about.txt"), function(res){
        $("div.about-body").html(textToHtml(res));
    });

    $.ajax({
        url:"txtall.txt",
        type:'HEAD',
        success: function(){
            $("div.cont").append('<a href="txtall.txt" class="btn btn-primary">下載TXT</a>');
        }
    });
}

</script>

</body>
</html>
