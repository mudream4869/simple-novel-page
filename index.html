<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <title> [小說書名] </title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.4/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.4/dist/css/bootstrap-theme.min.css">

    <script type="text/javascript" src="tools.js?v0.5.0"></script>
</head>

<body >

<div class="container">
<div class="row">
    <div class="col-md-8 col-md-offset-2 div-body">
        <div class="page-header">
            <div class="row">
                <div class="col-md-10"> <h1 class="novel-title">[小說書名]</h1> </div>
                <div class="col-md-2">
                    <br> <a href="about.html" class="btn btn-info btn-lg">簡介</a>
                </div>
            </div>
        </div>
    </div>
</div>
</div>

<script>

window.onload=init;

function init(){

    var div_body = document.querySelector("div.div-body");

    initNovelTitle();

    getArrayByFilename("chapters.txt", function(chap_list){
        for(var i = 0; i < chap_list.length; i++)
            appendChapter(div_body, chap_list[i]);
    }, function(){
        div_body.appendChild(el("div", "alert alert-danger", "讀不到 chapters.txt"));
    });

}

// 先照順序把章掛上去，各章的節列表再平行載入填進來
function appendChapter(div_body, chapter_name){

    var newdiv = el("div", "panel panel-default");
    var newdiv_head = el("div", "panel-heading");
    var newdiv_body = el("div", "panel-body");
    var newdiv_list = el("div", "list-group");

    newdiv_head.appendChild(el("h3", "panel-title", chapter_name));
    newdiv_body.appendChild(newdiv_list);
    newdiv.appendChild(newdiv_head);
    newdiv.appendChild(newdiv_body);
    div_body.appendChild(newdiv);

    getArrayByFilename(getChapterListUrl(chapter_name), function(tt_list){
        for(var j = 0; j < tt_list.length; j++){
            var link = el("a", "list-group-item", removeFileExt(tt_list[j]));
            link.href = getContentUrl(chapter_name, tt_list[j]);
            newdiv_list.appendChild(link);
        }
    }, function(){
        newdiv_list.appendChild(el("div", "list-group-item text-danger",
                                   "讀不到 " + chapter_name + "/list.txt"));
    });

}

</script>


</body>
</html>
