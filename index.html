<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <title> [小說書名] </title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/jquery@1.12.1/dist/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.4/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.4/dist/css/bootstrap-theme.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.3.4/dist/js/bootstrap.min.js"></script>

    <script type="text/javascript" src="tools.js?v0.4.0"></script>
</head>

<body >

<div class="container">
<div class="row">
    <div class="col-md-8 col-md-offset-2 div-body">
        <div class="page-header">
            <div class="row">
                <div class="col-md-10"> <h1 class="novel-title">[小說書名]</h1> </div>
                <div class="col-md-2">
                    <br> <a href="about.html" class="btn btn-info btn-lg">簡介</a>
                </div>
            </div>
        </div>
    </div>
</div>
</div>

<script>

window.onload=init;

function init(){

    var div_body = $("div.div-body");

    initNovelTitle();

    getArrayByFilename("chapters.txt", function(chap_list){
        for(var i = 0; i < chap_list.length; i++)
            appendChapter(div_body, chap_list[i]);
    }, function(){
        div_body.append(getNewDiv().addClass("alert alert-danger")
                                   .text("讀不到 chapters.txt"));
    });

}

// 先照順序把章掛上去，各章的節列表再平行載入填進來
function appendChapter(div_body, chapter_name){

    var newdiv = getNewDiv();
    var newdiv_head = getNewDiv();
    var newdiv_body = getNewDiv();
    var newdiv_list = getNewDiv();

    newdiv.addClass("panel panel-default");
    newdiv_head.addClass("panel-heading");
    newdiv_head.append($("<h3>").addClass("panel-title").text(chapter_name));
    newdiv_body.addClass("panel-body");
    newdiv_list.addClass("list-group");

    newdiv_body.append(newdiv_list);
    newdiv.append(newdiv_head);
    newdiv.append(newdiv_body);
    div_body.append(newdiv);

    getArrayByFilename(getChapterListUrl(chapter_name), function(tt_list){
        for(var j = 0; j < tt_list.length; j++){
            newdiv_list.append($("<a>").addClass("list-group-item")
                                       .attr("href", getContentUrl(chapter_name, tt_list[j]))
                                       .text(removeFileExt(tt_list[j])));
        }
    }, function(){
        newdiv_list.append(getNewDiv().addClass("list-group-item text-danger")
                                      .text("讀不到 " + chapter_name + "/list.txt"));
    });

}

</script>


</body>
</html>
